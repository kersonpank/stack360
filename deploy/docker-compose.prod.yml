# Stack360 — deploy de produção (VPS).
#
#   cd stack360
#   cp deploy/.env.prod.example deploy/.env.prod   # e preencha
#   docker compose --env-file deploy/.env.prod -f deploy/docker-compose.prod.yml up -d --build
#
# 3 serviços:
#   db    -> PostgreSQL 16 (schema `stack360`, volume persistente)
#   api   -> uvicorn app.stack360.main:app (só na rede interna)
#   caddy -> reverse proxy + HTTPS automático + Basic Auth no /docs
name: stack360

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: stack360
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?defina POSTGRES_PASSWORD em deploy/.env.prod}
      POSTGRES_DB: stack360
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U stack360 -d stack360"]
      interval: 5s
      timeout: 3s
      retries: 20

  api:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    restart: unless-stopped
    env_file:
      - .env.prod
    depends_on:
      db:
        condition: service_healthy
    expose:
      - "8000"          # NÃO publica na internet — só o caddy fala com a api

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on:
      - api
    ports:
      - "80:80"
      - "443:443"
    env_file:
      - .env.prod
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

volumes:
  pgdata:
  caddy_data:
  caddy_config:
